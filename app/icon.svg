<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The brand mark (lib/logo-geometry.js), simplified to two strata for
       favicon sizes, on an ink tile so it holds on any browser chrome. -->
  <defs><clipPath id="in"><circle cx="32" cy="32" r="20.2"/></clipPath></defs>
  <rect width="64" height="64" rx="14" fill="#000"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f7f7f5" stroke-width="3.6"/>
  <g clip-path="url(#in)">
    <rect x="0" y="23.5" width="64" height="4.4" fill="#f7f7f5"/>
    <rect x="29.8" y="23.5" width="4.4" height="40" fill="#f7f7f5"/>
    <g fill="#c9a24b">
      <rect x="0" y="34" width="27.2" height="3.2"/><rect x="36.8" y="34" width="27.2" height="3.2"/>
      <rect x="0" y="41.5" width="27.2" height="3.2"/><rect x="36.8" y="41.5" width="27.2" height="3.2"/>
    </g>
  </g>
</svg>
